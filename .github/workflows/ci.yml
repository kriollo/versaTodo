name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    php:
        runs-on: ubuntu-latest
        # PostgreSQL desechable para las pruebas: el motor de producción
        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_PASSWORD: prueba-local
                    POSTGRES_DB: panel
                ports: ['55433:5432']
                options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
        env:
            VERSA_TEST_DB: 127.0.0.1:55433:panel:postgres:prueba-local
        steps:
            - uses: actions/checkout@v7
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: intl, mbstring, pdo_mysql, pdo_pgsql, pdo_sqlite, curl, fileinfo, zip, gd
                  coverage: none
            # Desde composer.lock: lo mismo que se despliega
            - run: composer install --no-interaction --no-progress
            - run: composer audit
            - run: php versaCLI config:init < /dev/null
            # mago fmt (formato) y pest (pruebas)
            - run: composer check
            # Lo que una versión nueva de versawys/kernel puede romper: clases, rutas, plantillas y el contrato kernel ↔ app
            - run: php versaCLI app:check:deploy

    frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
              with:
                  version: 11
            - uses: actions/setup-node@v7
              with:
                  node-version: 22
            # Falla si pnpm-lock.yaml no corresponde a package.json
            - run: pnpm install --frozen-lockfile
            # Solo dependencias que llegan al navegador; las de compilación las vigila Dependabot
            - run: pnpm audit --prod
            - run: pnpm lint
            - run: pnpm compile
